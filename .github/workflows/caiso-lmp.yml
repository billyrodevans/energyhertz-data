# Hourly CAISO LMP refresh -> Cloudflare R2.
# Runs at 28 minutes past each hour (CAISO publishes 15-minute prices ~22-25 minutes ahead,
# and GitHub's busiest time is the top of the hour). Can also be started by hand from the Actions tab.
name: CAISO LMP refresh

on:
  schedule:
    - cron: "28 * * * *" # main run
    - cron: "48 * * * *" # backup: only contacts CAISO if the main run was skipped or incomplete
  workflow_dispatch:
    inputs:
      hour:
        description: "Optional UTC hour to (re)publish, e.g. 2026-11-11T01:00Z. Leave blank for the current hour."
        required: false
        default: ""

permissions:
  contents: read
  issues: write # to open an alert issue

concurrency:
  group: caiso-lmp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HOUR: ${{ inputs.hour }}
        run: |
          if [ -n "$HOUR" ]; then
            python -m caiso_lmp.run --r2 --hour "$HOUR"
          elif [ "${{ github.event.schedule }}" = "48 * * * *" ]; then
            python -m caiso_lmp.run --r2 --skip-if-complete
          else
            python -m caiso_lmp.run --r2
          fi

      # Any error or warning -> comment on (or open) the "Data alert: CAISO LMP" issue.
      # GitHub emails you about new issues/comments; a failed run also emails you.
      - name: Report issues
        if: always() && hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data alert: CAISO LMP"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file alert.md
          else
            gh issue create --title "$title" --body-file alert.md
          fi
