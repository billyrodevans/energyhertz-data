# Hourly CAISO LMP refresh -> Cloudflare R2.
# Runs at 28 minutes past each hour (CAISO publishes 15-minute prices ~22-25 minutes ahead,
# and GitHub's busiest time is the top of the hour). Can also be started by hand from the Actions tab.
name: CAISO LMP refresh

on:
  schedule:
    - cron: "28 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # to open an alert issue

concurrency:
  group: caiso-lmp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m caiso_lmp.run --r2

      # Any error or warning -> comment on (or open) the "Data alert: CAISO LMP" issue.
      # GitHub emails you about new issues/comments; a failed run also emails you.
      - name: Report issues
        if: always() && hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data alert: CAISO LMP"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file alert.md
          else
            gh issue create --title "$title" --body-file alert.md
          fi
