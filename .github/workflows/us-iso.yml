# US ISO comparison: yearly build (run by hand) and a monthly validity check.
# The monthly check runs on the 12th (first run 2026-12-12) and always opens/updates an issue,
# so Billy hears about it directly whatever else is going on.
name: US ISO data

on:
  workflow_dispatch:
    inputs:
      task:
        description: "build (yearly data) or validate (monthly check)"
        required: true
        default: validate
        type: choice
        options: [validate, build]
      year:
        description: "Data year for build (default: last year)"
        required: false
        default: ""
  schedule:
    - cron: "0 17 12 * *" # 12th of each month, 17:00 UTC (9-10 AM Pacific)

permissions:
  contents: read
  issues: write

concurrency:
  group: us-iso
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TASK: ${{ inputs.task || 'validate' }}
          YEAR: ${{ inputs.year }}
        run: |
          if [ "$TASK" = "build" ]; then
            python -m us_iso.build --r2 ${YEAR:+--year "$YEAR"}
          else
            python -m us_iso.validate --r2
          fi

      # After a yearly build, clear Cloudflare's cache so data.energyhertz.com serves the new files
      # right away (otherwise the old ones stay up to 24 h). Needs two repo secrets:
      #   CF_ZONE_ID    the energyhertz.com zone ID (Cloudflare dashboard, zone Overview page)
      #   CF_PURGE_TOKEN an API token limited to "Zone > Cache Purge > Purge" on that zone only
      # Purging by URL didn't clear these files (2026-11-11), so this purges everything; the site
      # itself is served by Workers, and the data files are simply fetched fresh on the next request.
      - name: Purge Cloudflare cache
        if: success() && inputs.task == 'build'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::Cloudflare purge secrets not set; purge the cache by hand"
            printf '\n- [ACTION] Cloudflare cache NOT purged automatically (secrets CF_ZONE_ID / CF_PURGE_TOKEN missing): run Purge Everything on energyhertz.com\n' >> checks.md
            exit 0
          fi
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$resp" | grep -q '"success":true'; then
            echo "Cloudflare cache purged"
            printf '\n- Cloudflare cache purged automatically after the build\n' >> checks.md
          else
            echo "::error::Cloudflare purge failed"
            printf '\n- [WARNING] Cloudflare cache purge FAILED: run Purge Everything on energyhertz.com by hand\n' >> checks.md
            exit 1
          fi

      - name: Report to an issue
        if: always() && hashFiles('checks.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="US ISO estimates: checks"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file checks.md
          else
            gh issue create --title "$title" --body-file checks.md
          fi
